name: Branch Sync (staging -> main)

on:
  workflow_dispatch:
  push:
    branches: [ "staging" ]

permissions:
  contents: read
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync staging to main
        uses: JDTX0/branch-sync@v1.5.1
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FROM_BRANCH: staging
          TO_BRANCH: main
          PULL_REQUEST_TITLE: Deploy to production (Automated)
          PULL_REQUEST_BODY: This is an automated pull request to deploy the staging branch to production.
          CONTENT_COMPARISON: true
          # Optional:
          # REVIEWERS: '["alice","bob"]'
          # TEAM_REVIEWERS: '["platform-team"]'
          # PULL_REQUEST_AUTO_MERGE_METHOD: false
